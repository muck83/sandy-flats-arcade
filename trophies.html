<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trophy Shelf · Sandy Flats Arcade</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=IBM+Plex+Mono:wght@500;600&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&display=swap">
<link rel="stylesheet" href="sfa-kit.css?v=20261102a">
<style>
.wrap{max-width:1200px;margin:0 auto;padding:12px 16px 40px}
.intro{color:var(--muted);margin:10px 0 14px;max-width:75ch}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.filters select{padding:8px 10px;border-radius:10px;background:var(--panel2);color:var(--ink);border:2px solid var(--line);font:inherit}
.sums{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:16px}
.sum{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px 16px}
.sum b{display:block;font:400 40px var(--display);color:var(--marquee);line-height:1}.sum span{color:var(--muted);font-size:14px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;padding:18px;border-radius:20px;background:linear-gradient(180deg,#2a1d12 0%,#3a2716 100%);box-shadow:inset 0 -14px 0 #24170c}
.tro{position:relative;text-align:center;padding:12px 10px 14px;border-radius:16px;background:rgba(0,0,0,.28);border:2px solid rgba(255,201,74,.25)}
.tro.win{border-color:#FFC94A;box-shadow:0 0 18px rgba(255,201,74,.25)}
.tro .ic{font-size:54px;line-height:1.1}.tro b{display:block;font:400 19px var(--display);line-height:1.1;margin:4px 0}.tro p{margin:0;font-size:13px;color:var(--muted)}
.tro small{display:block;margin-top:6px;font-size:12px;color:var(--muted)}
.empty{color:var(--muted);padding:30px;text-align:center}
.goal{margin:0 0 16px;padding:12px 16px;border-radius:16px;background:var(--panel);border:2px dashed var(--marquee)}
.goal i{display:block;height:12px;border-radius:99px;background:var(--panel2);overflow:hidden;margin-top:6px}.goal u{display:block;height:100%;background:var(--marquee)}
body.projector .tro .ic{font-size:72px}body.projector .tro b{font-size:24px}
</style>
</head><body>
<div class="wrap">
  <header class="topbar"><a class="brand" href="index.html">Sandy Flats Arcade</a><h1 class="gtitle">🏆 Trophy Shelf</h1></header>
  <p class="intro">Every boss the class has beaten, every Big Board it has cleared and every Lane Clash battle this term. Trophies are added automatically when a game ends on your console, and they're kept on this computer.</p>
  <div class="filters"><select id="cls" aria-label="Class"></select><button type="button" class="btn" id="proj">📺 Big for the projector</button><button type="button" class="btn" id="csv">Download (CSV)</button></div>
  <div id="out"></div>
</div>
<script src="config.js?v=20261102a"></script>
<script src="sfa-kit.js?v=20261102a"></script>
<script src="sfa-nav.js?v=20261105a"></script>
<script>
(function () {
  var esc = SFA.esc, T = (SFA.store.get('teacher.trophies', []) || []).slice().reverse(), sel = document.getElementById('cls'), out = document.getElementById('out');
  var classes = {}; T.forEach(function (t) { if (t.cls) classes[t.cls] = 1; });
  sel.innerHTML = '<option value="">All classes</option>' + Object.keys(classes).sort().map(function (c) { return '<option value="' + esc(c) + '">Class ' + esc(c) + '</option>'; }).join('');
  sel.value = SFA.store.get('teacher.trophies.cls', ''); if (!classes[sel.value]) sel.value = '';
  sel.onchange = function () { SFA.store.set('teacher.trophies.cls', sel.value); draw(); };
  document.getElementById('proj').onclick = function () { document.body.classList.toggle('projector'); };
  function day(t) { return new Date(t).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }); }
  function card(t) {
    if (t.k === 'raid') return { win: t.win, ic: t.win ? '🏆' : '💨', title: t.win ? 'Beat ' + t.boss : t.boss + ' got away', sub: (t.mode || 'Boss Raid') + ' · ' + t.n + ' raiders' + (t.win ? '' : ' · ' + t.left + '% health left') };
    if (t.k === 'board') return { win: t.win, ic: t.win ? '🔠' : '🧩', title: t.win ? 'Cleared the Big Board' : 'Big Board: ' + t.found + ' of ' + t.of + ' words', sub: (t.theme || 'Big Board') + ' · ' + t.of + ' words' };
    if (t.k === 'clash') return { win: t.win >= 0, ic: t.win >= 0 ? '⚔️' : '🤝', title: t.win >= 0 ? t.teams[t.win] + ' won' : 'Lane Clash: a draw', sub: t.teams.join(' vs ') + ' · ' + (t.score || []).join(' to ') + ' gold' };
    return { ic: '🏅', title: t.k, sub: '' };
  }
  function draw() {
    var L = T.filter(function (t) { return !sel.value || t.cls === sel.value; });
    var raids = L.filter(function (t) { return t.k === 'raid'; }), boards = L.filter(function (t) { return t.k === 'board'; }), clashes = L.filter(function (t) { return t.k === 'clash'; });
    var beat = raids.filter(function (t) { return t.win; }).length, clear = boards.filter(function (t) { return t.win; }).length;
    var wins = {}; clashes.forEach(function (t) { if (t.win >= 0) wins[t.teams[t.win]] = (wins[t.teams[t.win]] || 0) + 1; });
    var champ = Object.keys(wins).sort(function (a, b) { return wins[b] - wins[a]; })[0];
    var goal = 10, got = beat + clear;
    out.innerHTML = '<div class="sums">' +
      '<div class="sum"><b>' + beat + '</b><span>bosses beaten (of ' + raids.length + ' raids)</span></div>' +
      '<div class="sum"><b>' + clear + '</b><span>Big Boards cleared (of ' + boards.length + ')</span></div>' +
      '<div class="sum"><b>' + clashes.length + '</b><span>Lane Clash battles' + (champ ? ' · most wins: ' + esc(champ) + ' (' + wins[champ] + ')' : '') + '</span></div></div>' +
      '<div class="goal"><b>Class goal: ' + got + ' of ' + goal + ' class wins</b> (bosses beaten and boards cleared)<i><u style="width:' + Math.min(100, Math.round(100 * got / goal)) + '%"></u></i></div>' +
      (L.length ? '<div class="shelf">' + L.map(function (t) { var c = card(t); return '<div class="tro' + (c.win ? ' win' : '') + '"><div class="ic">' + c.ic + '</div><b>' + esc(c.title) + '</b><p>' + esc(c.sub) + '</p><small>' + esc(day(t.t)) + ' · ' + esc(t.label || t.lesson || '') + (t.cls ? ' · Class ' + esc(t.cls) : '') + '</small></div>'; }).join('') + '</div>'
        : '<div class="shelf"><p class="empty">No trophies yet. Run a Boss Raid, a Big Board or a Lane Clash in a live lesson and they appear here.</p></div>');
  }
  document.getElementById('csv').onclick = function () {
    var rows = [['When', 'Class', 'Lesson', 'Game', 'Result', 'Detail']].concat(T.map(function (t) { var c = card(t); return [new Date(t.t).toLocaleString(), t.cls || '', t.label || t.lesson || '', t.k, c.title, c.sub]; }));
    var csv = rows.map(function (r) { return r.map(function (v) { v = String(v == null ? '' : v); if (/^[=+\-@]/.test(v)) v = "'" + v; return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(','); }).join('\n');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'sandy-flats-trophies.csv'; a.click();
  };
  draw();
})();
</script>
</body></html>
