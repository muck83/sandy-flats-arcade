<div class="wrap">
  <header class="topbar"><a class="brand" href="index.html">Sandy Flats Arcade</a><h1 class="gtitle">👕 Wardrobe</h1></header>
  <p class="intro">Dress your avatar for the fashion show and the class games. You earn coins from everything you do: arcade game levels and certificates, Boss Raid, Lane Clash and Big Board XP, lesson answers and Climb. Higher arcade levels unlock the best gear.</p>

<script>
(function () {
  var S = SFA.sync, box = document.getElementById('wardrobe'), w = null, was = null;
  function go() {
    var me = S && S.me ? S.me.sid : null;
    document.getElementById('signin').hidden = !!me;
    if (w && me === was) return;
    was = me; if (window.SFA_WARDROBE) { SFA_WARDROBE.refresh(); w = SFA_WARDROBE.mount(box); }
  }
  if (S && S.onChange) S.onChange(go); else go();
})();
</script>
