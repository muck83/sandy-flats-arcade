<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Name Them Back</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Patrick+Hand&family=IBM+Plex+Mono:wght@500;600&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&display=swap">
<style>/* Sandy Flats Arcade: shared kit styles.
   Layout: a 16:9 cut-paper stage on top, a fairground control desk under it; one deliberate dark look, matching the films' cinema.
   Single-theme by choice: every colour is set explicitly here. */
:root{
  color-scheme:dark;
  --bg:#110F17; --panel:#1B1824; --panel2:#24202F; --ink:#F3EFE7; --muted:#ABA5BC; --line:#3A3550;
  --marquee:#FFC94A; --red:#E8584C; --green:#3BFF8A; --teal:#5CE0B8; --violet:#B48CFF;
  --paper:#F7F3E3; --paper2:#EFE7CF; --paperink:#1B1A22; --token:#8E5BD6; --million:#D12F2F;
  --display:"Luckiest Guy","Bricolage Grotesque",system-ui,sans-serif;
  --ui:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --hand:"Patrick Hand","Bricolage Grotesque",cursive;
  --fs:16px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--ui);font-size:var(--fs);line-height:1.5}
body.projector{--fs:19px}
body.projector .wrap{max-width:1500px;zoom:1.1}
body.projector .play{grid-template-columns:minmax(0,1fr)}
a{color:var(--marquee)}
:focus-visible{outline:3px solid var(--marquee);outline-offset:3px}
button{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:14px 48px}
h1,h2,h3{text-wrap:balance}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- top bar ---------- */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-bottom:10px;border-bottom:2px dashed var(--line)}
.brand{font-family:var(--display);font-size:18px;letter-spacing:.03em;color:var(--marquee);text-decoration:none;white-space:nowrap}
.gtitle{font-family:var(--display);font-weight:400;font-size:clamp(22px,3.4vw,32px);letter-spacing:.02em;margin:0;line-height:1;flex:1 1 auto;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font:600 13px var(--ui);padding:5px 11px;border-radius:999px;background:var(--panel2);color:var(--ink);border:2px solid var(--line);white-space:nowrap;cursor:pointer}
.chip:hover{border-color:var(--marquee)}
.chip[aria-pressed="true"]{background:var(--marquee);color:#231800;border-color:var(--marquee)}
.chip.static{cursor:default}
.chip.static:hover{border-color:var(--line)}
.chip b{font-family:var(--mono);font-weight:600}

/* ---------- stage ---------- */
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;margin-top:12px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.stage canvas{display:block;width:100%;height:100%}
.capbar{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);max-width:92%;text-align:center;background:rgba(10,8,16,.82);color:#fff;border-radius:10px;padding:7px 14px 8px;font-size:clamp(13px,2.05vw,22px);line-height:1.3;pointer-events:none}
.capbar:empty{display:none}
.capbar b{letter-spacing:.06em;font-size:.78em;margin-right:8px}
.stagebtns{position:absolute;top:8px;right:8px;display:flex;gap:6px}
.stagebtns button{font:600 12px var(--ui);padding:5px 10px;border-radius:999px;border:0;background:rgba(0,0,0,.55);color:#fff;cursor:pointer}
.stagebtns button:hover{background:rgba(0,0,0,.8)}
@media (max-width:600px){.stage{overflow:visible;margin-bottom:46px}.stagebtns{top:auto;bottom:-42px;right:0;left:0;justify-content:flex-end;flex-wrap:wrap}.stagebtns button{font-size:13px;padding:8px 12px;min-height:36px;background:var(--panel2);border:2px solid var(--line)}}
.startcover{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,8,16,.5);border:0;cursor:pointer;padding:16px}
.startcover span{display:flex;align-items:center;gap:12px;background:var(--marquee);color:#231800;font-weight:800;font-size:clamp(16px,2.6vw,24px);padding:14px 28px;border-radius:999px;box-shadow:0 8px 0 #B88A1A}
.startcover[hidden]{display:none}

/* ---------- desk ---------- */
.play{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;margin-top:12px;align-items:start}
.play>.main{display:flex;flex-direction:column;gap:10px;min-width:0}
.play>.main .stage{margin-top:0}
@media (max-width:900px){.play{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.card h2{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.03em;margin:0 0 6px;color:var(--marquee)}
.card h3{font:700 13px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}
.task{margin:0;font-size:1.02em;max-width:62ch}
.task strong{color:var(--marquee)}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}

/* buttons */
.btn{font:700 15px var(--ui);padding:10px 18px;border-radius:999px;border:2px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer;line-height:1.1}
.btn:hover{border-color:var(--marquee)}
.btn.primary{background:var(--marquee);border-color:var(--marquee);color:#231800;box-shadow:0 4px 0 #B88A1A}
.btn.primary:active{transform:translateY(2px);box-shadow:0 2px 0 #B88A1A}
.btn.good{background:var(--teal);border-color:var(--teal);color:#06261C}
.btn.small{font-size:13px;padding:6px 12px}
.btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
.btn.glow,.tok.glow,.choice button.glow,.tile.glow{animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 0 0 rgba(255,201,74,.0)}to{box-shadow:0 0 0 6px rgba(255,201,74,.55)}}

/* tokens */
.tray{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tok{font:600 18px var(--mono);min-width:48px;height:48px;padding:0 12px;border-radius:999px;border:3px solid var(--paperink);background:var(--token);color:#fff;cursor:pointer;box-shadow:0 4px 0 #4A2C7A}
.tok:hover{filter:brightness(1.12)}
.tok:active{transform:translateY(2px);box-shadow:0 2px 0 #4A2C7A}
.tok.zero{background:#F39C34;box-shadow:0 4px 0 #9A5A12;color:#1b1a22}
.tok.one{background:#2F5BD6;box-shadow:0 4px 0 #1A3380}
.tok.million{background:var(--million);box-shadow:0 4px 0 #7A1414;font-size:15px}
.tok.jam{background:#F49AC2;color:#5a2440;box-shadow:0 4px 0 #A8577C;cursor:not-allowed;text-decoration:line-through}
.tok:disabled{opacity:.45;cursor:not-allowed}
.typein{display:flex;gap:6px;align-items:center}
.num{font:600 18px var(--mono);width:7.2em;max-width:100%;padding:9px 10px;border-radius:10px;border:2px solid var(--line);background:#0E0C14;color:var(--ink)}
.num.sm{width:5.2em}
.num:focus{border-color:var(--marquee);outline:none}
.num.bad{border-color:var(--red)}
.num.ok{border-color:var(--teal)}

/* the paper tape (till receipt) */
.tape{background:var(--paper);color:var(--paperink);border-radius:4px;padding:10px 12px 14px;font:600 16px var(--mono);position:relative;min-height:96px;
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat, radial-gradient(circle at 6px 0,transparent 5px,#000 5.5px) bottom/12px 8px repeat-x;
          mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat, radial-gradient(circle at 6px 0,transparent 5px,#000 5.5px) bottom/12px 8px repeat-x}
.tape table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tape th{font:700 11px var(--ui);letter-spacing:.14em;text-transform:uppercase;text-align:left;color:#6b6457;border-bottom:1.5px dashed #b9b09a;padding:2px 4px 5px}
.tape td{padding:4px;border-bottom:1px dotted #cfc6ad;overflow-wrap:anywhere}
.tape td.arrow{color:#8d856f;width:1.5em;text-align:center}
.tape tr.hl td{background:#FFE58A}
.tape tr.pre td{color:#8E1B1B}
.tape tr.pick td{background:#BDEFD9}
.tape .empty{color:#8d856f;font:500 14px var(--ui);padding:6px 4px}
.tapewrap{max-height:260px;overflow:auto;border-radius:4px}

/* rule builder: two paper panels like the machine face */
.rule{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font:600 22px var(--mono)}
.panelp{display:flex;align-items:center;gap:6px;background:var(--paper);color:var(--paperink);border:3px solid var(--paperink);border-radius:8px;padding:6px 8px}
.panelp .op{font-size:24px;min-width:1ch;text-align:center}
.panelp input{font:600 22px var(--mono);width:4.4em;padding:4px 6px;border-radius:6px;border:2px solid #b9b09a;background:#fff;color:var(--paperink)}
.panelp input:focus{outline:none;border-color:#8E5BD6}
.panelp.hl{box-shadow:0 0 0 5px rgba(255,201,74,.6)}
.xword{font:600 18px var(--mono);color:var(--muted)}

/* gauges */
.gauge{display:flex;align-items:center;gap:10px;font:600 14px var(--ui);color:var(--muted)}
.fuel{display:flex;gap:4px}
.fuel i{width:16px;height:22px;border-radius:4px;background:var(--marquee);box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.fuel i.used{background:var(--panel2)}

/* level map */
.levels{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.levels li button{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--panel2);cursor:pointer;font:600 14px var(--ui);color:var(--ink)}
.levels li button:hover{border-color:var(--marquee)}
.levels li button[aria-current="true"]{border-color:var(--marquee);background:#2E2716}
.levels li button:disabled{opacity:.45;cursor:not-allowed}
.levels .tier{font:700 10px var(--ui);letter-spacing:.12em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--bg);color:var(--muted);white-space:nowrap}
.levels .tier.core{color:var(--marquee)}
.levels .tier.stretch{color:var(--violet)}
.levels .nm{flex:1;min-width:0}
.levels .st{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}
.levels .st.done{color:var(--green)}

/* feedback strip */
.say{border-left:4px solid var(--marquee);padding:6px 10px;background:var(--panel2);border-radius:0 10px 10px 0;margin:8px 0 0;font-size:.98em}
.say.bad{border-color:var(--red)}
.say.good{border-color:var(--teal)}
.say:empty{display:none}

/* comparison table */
.cmp{border-collapse:collapse;font:600 15px var(--mono);margin-top:6px}
.cmp th,.cmp td{border:1px solid var(--line);padding:4px 10px;text-align:center}
.cmp th{font:700 11px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cmp td.no{color:var(--red)} .cmp td.yes{color:var(--green)}
.scroll-x{overflow-x:auto;max-width:100%}

/* groups of four (low floor) */
.groups{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:600 15px var(--mono)}
.grp{display:grid;grid-template-columns:repeat(2,12px);gap:3px;padding:5px;border:2px dashed var(--line);border-radius:8px}
.grp i{width:12px;height:12px;border-radius:50%;background:var(--marquee)}
.grp i.gone{background:transparent;border:2px solid var(--red);position:relative}

/* tiles (sentence frames) */
.frame{display:flex;flex-wrap:wrap;gap:6px;align-items:center;line-height:2.1;font-size:1.02em}
.slot{display:inline-flex;min-width:6em;min-height:34px;align-items:center;justify-content:center;border:2px dashed var(--marquee);border-radius:8px;padding:2px 8px;color:var(--marquee);cursor:pointer;background:transparent;font:600 15px var(--ui)}
.slot.filled{border-style:solid;background:var(--panel2);color:var(--ink)}
.tiles{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tile{font:600 14px var(--ui);padding:6px 10px;border-radius:8px;border:2px solid var(--line);background:var(--paper);color:var(--paperink);cursor:pointer}
.tile[aria-pressed="true"]{background:var(--marquee)}
textarea.explain{width:100%;min-height:78px;font:500 15px var(--ui);padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:#0E0C14;color:var(--ink)}
.choice{display:flex;flex-direction:column;gap:6px}
.choice button{text-align:left;padding:9px 12px;border-radius:10px;border:2px solid var(--line);background:var(--panel2);cursor:pointer;font:500 15px var(--ui);color:var(--ink)}
.choice button:hover{border-color:var(--marquee)}
.choice button.no{border-color:var(--red);opacity:.7}
.choice button.yes{border-color:var(--green)}

/* overlays */
.ov{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(6,5,10,.78);padding:16px;overflow:auto}
.ov[hidden]{display:none}
.dlg{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:18px 20px;max-width:720px;width:100%;max-height:calc(100vh - 32px);overflow:auto;position:relative}
.dlg.wide{max-width:980px}
.dlg h2{font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.03em;margin:0 0 8px;color:var(--marquee)}
.dlg .x{position:absolute;top:10px;right:10px}
.reelbox{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:#000;border-radius:10px;overflow:hidden}
.reelbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.reelhead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:10px}
.reelhead .k{font:700 12px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.reelhead h2{margin:0}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:80;background:var(--marquee);color:#231800;font-weight:700;padding:10px 18px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:calc(100vw - 32px);text-align:center}
.toast[hidden]{display:none}

/* glossary */
.gloss{width:100%;border-collapse:collapse}
.gloss td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.gloss td.ar{font-size:1.15em;text-align:right;font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif}
.gloss td.en{font-weight:700}
.gloss .eg{color:var(--muted);font-size:.92em}

/* caption log */
.clog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto}
.clog li{padding:6px 8px;border-radius:8px;background:var(--panel2)}
.clog b{font-size:.8em;letter-spacing:.06em;margin-right:6px}

/* certificates */
.certs{display:flex;flex-direction:column;gap:8px}
.certrow{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--panel2)}
.certrow.earned{border-color:var(--marquee)}
.certrow .medal{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);background:var(--bg);color:var(--muted)}
.certrow.earned .medal{background:var(--marquee);color:#231800}
.certrow.std .medal{border-radius:6px}
.certrow .ct{flex:1;min-width:0}
.certrow .ct b{display:block}
.certrow .ct small{color:var(--muted);display:block;line-height:1.35}
.certimg{width:100%;height:auto;border-radius:6px;display:block;background:var(--paper)}
.namebox{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.namebox input[type=text]{font:600 18px var(--ui);padding:9px 12px;border-radius:10px;border:2px solid var(--line);background:#0E0C14;color:var(--ink);flex:1 1 220px;min-width:0}
.code{font:600 20px var(--mono);letter-spacing:.06em;color:var(--marquee)}

/* teacher */
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.tset{background:var(--panel2);border-radius:12px;padding:10px 12px}
.tset label{display:block;font-weight:700;margin-bottom:4px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{font:600 13px var(--ui);padding:5px 10px;border-radius:999px;border:2px solid var(--line);background:var(--bg);cursor:pointer;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--marquee);color:#231800;border-color:var(--marquee)}
body.teacher .tonly{display:revert}
.tonly{display:none}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Lost Reels vault ---------- */
.vault{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.can{display:flex;gap:10px;align-items:center;text-align:left;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);cursor:pointer;min-width:0;color:var(--ink);font:inherit}
.can:hover:not(:disabled){border-color:var(--marquee)}
.can:disabled{cursor:default}
.can .canart{flex:0 0 auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:18px;background:#0E0C14;color:var(--muted);border:3px dashed var(--line)}
.can.got .canart{background:var(--marquee);color:#231800;border:3px solid #231800}
.can.gold .canart{border-color:#C9981A}
.can.gold.got .canart{background:linear-gradient(135deg,#FFE58A,#C9981A)}
.can .cant{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.can .cant b{font-size:14px}
.can .cant small{font-size:12px;color:var(--muted)}
.can:not(.got) .cant b{color:var(--muted)}
.footer{margin-top:28px;padding-top:12px;border-top:2px dashed var(--line);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;color:var(--muted);font-size:14px}

/* ---------- detective games (G2, G6) ---------- */
.suspects{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:10px}
.suspect{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.suspect .shead{display:flex;flex-direction:column}
.suspect .shead b{font-family:var(--display);font-weight:400;font-size:18px;letter-spacing:.03em;color:var(--marquee)}
.suspect .shead span{font:500 13px var(--mono)}
.suspect small.good{color:var(--green)} .suspect small.bad{color:var(--red)}
.tray.small{gap:5px}
.tok.sm{font-size:15px;min-width:38px;height:38px;padding:0 8px;box-shadow:0 3px 0 #4A2C7A}
.minitape{background:var(--paper);color:var(--paperink);border-radius:4px;padding:6px 8px;font:600 14px var(--mono);display:flex;flex-wrap:wrap;gap:4px 10px;min-height:34px;font-variant-numeric:tabular-nums}
.minitape .tr{white-space:nowrap}
.minitape .tr.clash{background:#FFC1BA;border-radius:4px;padding:0 4px}
.pin{border:2px dashed var(--marquee);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
.pairs{display:flex;flex-wrap:wrap;gap:6px}
.tile.pair{font-family:var(--mono)}
.snack{display:inline-flex;align-items:center;gap:6px;background:var(--paper);color:var(--paperink);border-radius:999px;padding:3px 10px 3px 4px;font-weight:700;font-size:14px}
.snack i{width:18px;height:18px;border-radius:50%;border:2px solid var(--paperink)}
.clues{margin:6px 0;padding-left:20px}
.clues li{margin:2px 0}
.node.pickable{cursor:pointer}
.node.pickable:hover circle,.node.pickable:focus circle,.node.pickable:hover rect,.node.pickable:focus rect{fill:#FFE58A}
.node:focus{outline:none}
.node.glow circle,.node.glow rect{fill:#FFC94A}
.pgrid{display:inline-flex;flex-direction:column;gap:2px;padding:8px;background:#0E0C14;border-radius:10px;max-width:100%;overflow-x:auto}
.prow{display:flex;gap:2px;align-items:center}
.plab{width:26px;text-align:center;font:600 12px var(--mono);color:var(--muted)}
.pcell{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:transparent;cursor:pointer;padding:0}
.pcell[aria-pressed="true"]{background:#fff;box-shadow:0 0 8px #FFD23F}
.pcell:hover{border-color:var(--marquee)}
@media (max-width:600px){.pgrid .plab{width:38px}.pcell{width:38px;height:38px;flex:none}}

ol.proof{margin:8px 0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
ol.proof li{background:var(--paper);color:var(--paperink);border-radius:8px;padding:8px 10px}
ol.proof li>span:first-child{display:block;margin-bottom:4px}
.levels .tier.review{color:var(--teal)}

/* clarity pass: goal, numbered steps, done-when */
.task .goal{display:block;font-weight:700;color:var(--ink);font-size:1.06em;line-height:1.35}

<script>/* Sandy Flats Arcade: shared game shell for G2 onwards.
   Stage (cut-paper canvas with timer-safe animations), level map, hint ladder plumbing, level cards with reel pauses,
   certificate list + maker, chips and page chrome. A game supplies levels, certificates and level builders. */
(function () {
  'use strict';
  var SFA = window.SFA, V = SFA.vo, el = SFA.el, $ = SFA.$;

  /* ---------- stage ---------- */
  SFA.Stage = function (canvas) {
    var E = window.SFEngine(canvas), c = E.c;
    var S = { E: E, c: c, anims: [], draw: null, GY: E.GY };
    S.now = function () { return performance.now() / 1000; };
    S.talk = function (k) {
      var m = V.mouth(); if (!m.open || !m.who) return false;
      if (m.who === k) return true;
      var CH = { duo: ['zero', 'one'], nomarcus: ['priya', 'zero', 'one'], all: ['priya', 'zero', 'marcus', 'one'], everyone: ['priya', 'zero', 'marcus', 'one'], fg: ['machf', 'machg'] }[m.who];
      return !!(CH && CH.indexOf(k) >= 0);
    };
    // a: {dur, draw(q,u,T), t0?}. Resolves on a timer too, so hidden tabs never stall the game.
    S.anim = function (a) {
      a.t0 = a.t0 || S.now(); S.anims.push(a);
      return new Promise(function (res) {
        var fired = false; a.end = function () { if (fired) return; fired = true; res(); };
        setTimeout(function () { a.end(); var i = S.anims.indexOf(a); if (i >= 0) S.anims.splice(i, 1); }, Math.max(0, (a.t0 - S.now() + a.dur) * 1000) + 60);
      });
    };
    S.wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
    function frame(now) {
      var t = now / 1000, T = Math.floor(t * 12) / 12;
      E.reset(); c.save(); c.translate(0, -24);
      try { if (S.draw) S.draw(t, T); } catch (e) { console.error(e); S.draw = null; }
      S.anims = S.anims.filter(function (a) { var q = t - a.t0; if (q < 0) return true; if (q > a.dur) { if (a.end) a.end(); return false; } try { a.draw(q, Math.min(1, q / a.dur), T); } catch (e) { console.error(e); return false; } return true; });
      c.restore(); E.grain(); requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    return S;
  };

  /* ---------- game shell ---------- */
  // cfg: {id:'g2', no:2, name, levels:[{id,tier,name}], unlockStretchAfter:'C4', certs:[{key,title,sub,by,quote,line,crit,portrait,portraitSrc}],
  //       status(P)->{std, coreN, coreTotal, specials:[..], note}, artefact(C,P)->[lines], portrait(kind)->fn(eng), build(L, api), blank()}
  SFA.Game = function (cfg) {
    var G = { cfg: cfg };
    function blank() { return Object.assign({ done: {}, skipped: {}, hints: { r1: 0, r2: 0, r3: 0, r4: 0 }, streak: 0, wrong: 0, cur: null, seen: {} }, cfg.blank ? cfg.blank() : {}); }
    var P = G.P = Object.assign(blank(), SFA.store.get(cfg.id, {}) || {});
    G.save = function () { SFA.store.set(cfg.id, G.P); if (SFA.sync && SFA.sync.on) SFA.sync.report(cfg.id, G.P, SFA.sync.summarize(cfg.levels, G.P, cfg.status(G.P), cfg.certs)); };
    G.lv = function (id) { return cfg.levels.filter(function (l) { return l.id === id; })[0]; };
    G.unlocked = function (id) {
      var L = G.lv(id), i = cfg.levels.indexOf(L); if (i === 0 || L.tier === 'review') return true;
      if (L.tier === 'stretch') return !!(G.P.done[cfg.unlockStretchAfter] || G.P.skipped[cfg.unlockStretchAfter]);
      var prev = cfg.levels[i - 1]; return !!(G.P.done[prev.id] || G.P.skipped[prev.id]);
    };
    G.firstOpen = function () { for (var i = 0; i < cfg.levels.length; i++) { var L = cfg.levels[i]; if (!G.P.done[L.id] && G.unlocked(L.id)) return L.id; } return null; };
    var work = $('#workBody'), sayEl = $('#say');
    G.work = work;
    G.say = function (text, kind) { sayEl.className = 'say' + (kind ? ' ' + kind : ''); sayEl.textContent = text || ''; };
    G.setTask = function (h, html) { $('#workH').textContent = h; $('#task').innerHTML = html; };
    G.busy = false;
    G.lock = function (b) { G.busy = b; [].forEach.call(work.querySelectorAll('button,input,select'), function (x) { if (b) { x.dataset.wasDis = x.disabled ? '1' : ''; x.disabled = true; } else if (x.dataset.wasDis !== undefined) { x.disabled = x.dataset.wasDis === '1'; delete x.dataset.wasDis; } }); };
    G.firstTry = function (ok) { if (ok) { G.P.streak = (G.P.streak || 0) + 1; if (G.P.streak % 4 === 0) SFA.reels.addEP(1, 'first-try streak'); } else G.P.streak = 0; G.save(); };
    // hints: game sets G.hintFn(rung); G.rung tracks the highest rung used on the current level

    G.noteHint = function (r) { G.rung = Math.max(G.rung, r); G.levelMaxRung = Math.max(G.levelMaxRung, r); G.P.hints['r' + r]++; G.save(); G.updateChips(); };
    G.hint = function () {

      G.noteHint(next); G.hintFn(next);
    };
    $('#btnHint').addEventListener('click', G.hint); SFA.keys.h = G.hint;
    G.clearHL = function () { [].forEach.call(document.querySelectorAll('.glow,.hl'), function (x) { x.classList.remove('glow'); x.classList.remove('hl'); }); };

    G.levelDone = function (id, text, lines) {
      G.clearHL(); G.hintFn = null; G.say('');
      var L = G.lv(id), i = cfg.levels.indexOf(L), nxt = cfg.levels[i + 1];

      G.save(); G.renderLevels(); G.renderCerts(); G.updateChips();
      work.innerHTML = '';
      var box = el('div', { 'class': 'stack' }, [el('p', { 'class': 'say good', text: text || 'Level cleared.' })]);
      var row = el('div', { 'class': 'row' });
      var nextId = nxt && G.unlocked(nxt.id) ? nxt.id : G.firstOpen();
      if (nextId && nextId !== id) row.appendChild(el('button', { type: 'button', 'class': 'btn primary', id: 'btnNext', text: 'Next: ' + G.lv(nextId).name + ' →', onclick: function () { G.go(nextId); } }));
      row.appendChild(el('button', { type: 'button', 'class': 'btn', text: 'Certificates', onclick: function () { var ch = document.querySelector('.lvchip'); if (ch) ch.click(); else $('#certs').scrollIntoView({ behavior: 'smooth', block: 'center' }); } }));
      box.appendChild(row); work.appendChild(box);
      var ep = G.epoch;
      return V.say(lines || []).then(function () { if (ep !== G.epoch) return; return SFA.reels.pause(cfg.id).then(function () { var b = $('#btnNext'); if (b && ep === G.epoch) b.focus(); }); });
    };
    G.curId = null;
    // run fn after p only if the player is still on the same level
    G.after = function (p, fn) { var ep = G.epoch; return Promise.resolve(p).then(function (v) { if (ep === G.epoch) return fn(v); }); };
    G.go = function (id) {

      var L = G.lv(id); work.innerHTML = '';
      cfg.build(L, G);
      G.renderLevels(); G.updateChips();
      $('#stage').setAttribute('aria-label', 'Cartoon stage: ' + L.name);
    };
    G.renderLevels = function () {
      var ul = $('#levels'); ul.innerHTML = ''; var T = SFA.teacher.get();
      cfg.levels.forEach(function (L) {
        var st = G.P.done[L.id] ? '✓' : G.P.skipped[L.id] ? 'skipped' : G.unlocked(L.id) ? '' : 'locked';
        var b = el('button', { type: 'button', 'aria-current': String(G.curId === L.id), disabled: G.unlocked(L.id) || T.skip ? null : '' }, [el('span', { 'class': 'tier ' + L.tier, text: L.tier === 'low' ? 'Low floor' : L.tier === 'core' ? 'Core' : L.tier === 'review' ? 'Review' : 'Stretch' }), el('span', { 'class': 'nm', text: L.name }), el('span', { 'class': 'st' + (G.P.done[L.id] ? ' done' : ''), text: st })]);
        b.addEventListener('click', function () { G.go(L.id); });
        var li = el('li', {}, [b]);
        if (T.skip && !G.P.done[L.id]) li.appendChild(el('button', { type: 'button', 'class': 'btn small tonly', style: 'margin-top:4px', text: 'Teacher: skip ' + L.id, onclick: function () { G.P.skipped[L.id] = true; G.save(); G.renderLevels(); } }));

    };
    G.status = function () { return cfg.status(G.P); };
    G.renderCerts = function () {
      var s = G.status(), box = $('#certs'); box.innerHTML = '';
      cfg.certs.forEach(function (C) {

      round(2, function () { ST.cast.marcus.mood = 'happy'; talk(['g11_machg_8', 'g11_marcus_stays', 'g11_priya_now4'], function () {
        round(4, function () { ST.cast.marcus.opts = { noHelmet: true }; ST.mach[0].opts = { named: true, flex: true, helmet: true }; talk(['g11_machf_11', 'g11_marcus_at2'], function () { ST.cast.marcus.opts = {}; ST.mach[0].opts = { named: true }; sortPart(); }); });
      }); });
    });
  }

  /* ================= S1: the Erase-o-Matic (find the input) ================= */
  function S1(G) {
    reset('play'); ST.cast = { effie: { x: 60, sc: 1.6 }, priya: { x: 150, f: 1, sc: 0.62 }, marcus: { x: 240, f: 1, sc: 0.62, opts: {} }, gus: { x: 330, f: 1, sc: 0.62 }, zero: { x: 430, sc: 0.75 } };
    var LOCKS = [{ k: 'e', out: 11 }, { k: 'm', out: 5 }, { k: 'h', out: 9 }, { k: 'd', out: 13 }];
    var i = 0, wrong = 0, booms = 0, tm = 20, iv = null, ep = G.epoch, locks = [];
    ST.ball = { tm: 20, screen: '' };
    G.setTask('The Erase-o-Matic', job('Find the input that gives the output on each lock. Beat the timer.', 'The output is what comes <strong>OUT</strong>. You need what goes <strong>IN</strong>. Undo the rule: last thing done, first thing undone.', ['Read the lock.', 'Undo the rule to find the input.', 'Type the input and press <strong>Enter it</strong>.'], 'all 4 locks are defused (<b id="s1n">0</b> of 4).'));
    var body = el('div', { 'class': 'stack', style: 'gap:8px' }); G.work.appendChild(body);
    function show() {
      var L = LOCKS[i], M = MACH[L.k]; body.innerHTML = ''; tm = 20; ST.ball = { tm: tm, screen: M.nm + '( ? ) = ' + L.out }; G.say('');
      body.appendChild(el('p', { style: 'margin:0;font:600 20px var(--mono)', html: 'Lock ' + (i + 1) + ': ' + M.nm + '(x) = ' + M.rule + '<br><span style="color:var(--marquee)">' + M.nm + '( ? ) = ' + L.out + '</span>' }));
      var inp = numIn('s1in', 'The input'), ck = el('button', { type: 'button', 'class': 'btn primary', id: 's1ck', text: 'Enter it' });
      body.appendChild(el('div', { 'class': 'row' }, [el('span', { style: 'font:600 20px var(--mono)', text: 'Input: ' }), inp, ck]));
      body.appendChild(el('p', { 'class': 'muted', id: 's1undo', style: 'margin:0', text: undoText(L, 0) }));
      function enter() {
        if (busy()) return; var v = num(inp.value); if (v == null) { G.say('Type a number.', 'bad'); return; }
        var got = M.fn(v);
        if (got === L.out) { mark(inp, true); G.firstTry(true); stop(); ST.ball.ok = true; ST.ball.screen = M.nm + '(' + fmt(v) + ') = ' + L.out + ' ✓'; locks.push(M.nm + '(' + fmt(v) + ') = ' + L.out); G.note('DEFUSED: ' + work(L.k, v), 'hl'); G.say('Defused: ' + work(L.k, v) + '.', 'good');
          G.lock(true); setTimeout(function () { if (ep !== G.epoch || !ST.ball) return; ST.ball.deflate = 0; }, 700);
          G.after(V.say(i === 0 ? ['g11_one_didit', 'g11_all_dont'] : []), function () { G.lock(false); i++; var n = $('#s1n'); if (n) n.textContent = String(i); if (i < LOCKS.length) { show(); go(); } else done(); }); }
        else { mark(inp, false); wrong++; G.firstTry(false); tm = Math.max(1, tm - 7); ST.ball.bad = true; ST.ball.screen = M.nm + '(' + fmt(v) + ') = ' + fmt(got); setTimeout(function () { if (ST.ball) ST.ball.bad = false; }, 900);
          G.say('BZZT. ' + work(L.k, v) + ', not ' + L.out + '. ' + (v === L.out ? L.out + ' is what comes OUT. We need what goes IN.' : 'Undo the rule step by step.') + ' The timer jumped!', 'bad');
          if (v === L.out && i === 0) V.say('g11_priya_out'); }
      }
      ck.addEventListener('click', enter); onEnter(inp, enter); inp.focus();
    }
    function undoText(L, r) {
      var steps = { e: ['Last thing f did: + 1. Undo it: take away 1.', 'then × 2. Undo it: halve it.'], m: ['Last thing m did: − 3. Undo it: add 3.', 'then × 4. Undo it: divide by 4.'], h: ['h only did + 5. Undo it: take away 5.'], d: ['Last thing f did: + 3. Undo it: take away 3.', 'then × 2. Undo it: halve it.'] }[L.k];
      return 'Undo: ' + steps.join(' ');
    }
    function go() { stop(); iv = setInterval(function () { if (ep !== G.epoch) { stop(); return; } if (busy() || !ST.ball || ST.ball.ok) return; tm -= 0.1; ST.ball.tm = tm; if (tm <= 0) boom(); }, 100); }
    function stop() { if (iv) clearInterval(iv); iv = null; }
    function boom() {
      booms++; stop(); ST.ball.deflate = 0; G.say('POOF. Pink confetti everywhere. Gus whispers: "Wound it back. Try again." Undo the rule this time.', 'bad'); G.note('Time ran out on lock ' + (i + 1), 'pre');
      G.lock(true); G.after(V.say(['g11_eraser_laugh']), function () { G.lock(false); show(); go(); });
    }
    function done() { stop(); var clean = wrong === 0 && booms === 0 && G.levelMaxRung <= 1; var prev = G.P.s1; G.P.s1 = (prev && prev.clean && !clean) ? prev : { clean: clean, wrong: wrong, booms: booms, locks: locks.slice() }; G.save(); ST.ball = null;
      finishLevel('S1', 'All four locks defused: f(5) = 11, m(2) = 5, h(4) = 9 and f(5) = 13. To find the input, undo the rule: last thing done, first thing undone.' + (clean ? ' You earned Looked At It Backwards.' : ' The special certificate needs no wrong codes and no time-outs: replay to try again.'), ['g11_gus_backwards']); }
    G.hintFn = function (r) {
      var L = LOCKS[i]; if (!L) return; var M = MACH[L.k], ans = { e: 5, m: 2, h: 4, d: 5 }[L.k];
      if (r === 1) { V.say('g11_priya_out'); G.say('Hint: ' + L.out + ' is what comes OUT. You need the number that goes IN.'); }
      else if (r === 2) { V.say('g11_priya_undo'); G.say('Hint: ' + undoText(L)); }
      else if (r === 3) G.say('Worked step: ' + { e: '11 − 1 = 10, then 10 ÷ 2 = 5.', m: '5 + 3 = 8, then 8 ÷ 4 = 2.', h: '9 − 5 = 4.', d: '13 − 3 = 10, then 10 ÷ 2 = 5.' }[L.k] + ' Check: ' + work(L.k, ans) + '.');
      else { V.say('g11_gus_five'); var inp = $('#s1in'); if (inp) { inp.value = String(ans); $('#s1ck').click(); } }
    };
    body.appendChild(el('p', { 'class': 'muted', text: 'Effie is reading the lock...' }));
    G.lock(true); G.after(V.say(['g11_effie_goes', 'g11_effie_lock', 'g11_marcus_11', 'g11_priya_out']), function () { G.lock(false); show(); go(); });
  }

  /* ================= S2: Zero and One get titles (f(0) and f(1)) ================= */
  function S2(G) {
    reset('square', 'late'); ST.cast = { priya: { x: 110, f: 1, sc: 0.62 }, marcus: { x: 200, f: 1, sc: 0.62, opts: {} }, zero: { x: 760, sc: 0.85 }, one: { x: 870, f: -1, sc: 0.72 } };
    ST.mach = [{ kind: 'mux', x: 470, sc: 0.85, talkAs: 'machine', opts: { gold: true }, label: 'm(x) = 4x − 3' }];
    var LIST = ['m', 'f', 'h', 'G', 'd'], i = 0, wrong = 0, firstAll = true;
    G.setTask('Zero and One Get Titles', job('Zero is f(0). One is f(1). Work out both titles for each machine.', '', ['Read the machine\'s rule.', 'Put 0 in the slot, then 1. Type what comes out.', 'Press <strong>Give the titles</strong>.'], 'all 5 machines are done (<b id="s2n">0</b> of 5).'));
    var body = el('div', { 'class': 'stack', style: 'gap:8px' }); G.work.appendChild(body);
    function show() {
      var k = LIST[i], M = MACH[k], z = M.fn(0), o = M.fn(1); body.innerHTML = ''; G.say('');
      ST.mach = [k === 'm' ? { kind: 'mux', x: 470, sc: 0.85, talkAs: 'machine', opts: { gold: true } } : k === 'f' ? { kind: 'littlef', x: 470, sc: 1.4, talkAs: 'littlef', opts: { named: true } } : k === 'h' ? { kind: 'glitch', x: 470, sc: 0.85, talkAs: 'glitch', opts: { fixed: true } } : k === 'G' ? { kind: 'machg', x: 470, sc: 0.8, talkAs: 'machg', opts: { named: true } } : { kind: 'keypad', x: 470, sc: 1, rule: 'f(x) = 2x + 3' }]; ST.mach[0].label = M.nm + '(x) = ' + M.rule; ST.golds = [];
      body.appendChild(el('p', { style: 'margin:0;font:600 20px var(--mono)', text: (i + 1) + ' of 5: ' + M.who + ',  ' + M.nm + '(x) = ' + M.rule }));
      var zi = numIn('s2z', M.nm + ' of 0'), oi = numIn('s2o', M.nm + ' of 1'), ck = el('button', { type: 'button', 'class': 'btn primary', id: 's2ck', text: 'Give the titles' });
      body.appendChild(el('div', { 'class': 'row' }, [el('span', { 'class': 'tok zero', style: 'display:inline-grid;place-items:center;cursor:default', text: '0' }), el('span', { style: 'font:600 20px var(--mono)', text: M.nm + '(0) = ' }), zi]));
      body.appendChild(el('div', { 'class': 'row' }, [el('span', { 'class': 'tok one', style: 'display:inline-grid;place-items:center;cursor:default', text: '1' }), el('span', { style: 'font:600 20px var(--mono)', text: M.nm + '(1) = ' }), oi]));
      body.appendChild(el('div', { 'class': 'row' }, [ck])); zi.focus(); onEnter(zi, function () { oi.focus(); }); onEnter(oi, check); ck.addEventListener('click', check);
      function check() {
        if (busy()) return; var a = num(zi.value), b = num(oi.value); if (a == null || b == null) { G.say('Type both titles.', 'bad'); return; }
        mark(zi, a === z); mark(oi, b === o);
        if (a === z && b === o) { G.firstTry(true); gold(M.nm + '(0) = ' + fmt(z) + '    ' + M.nm + '(1) = ' + fmt(o), 480, 90, 30); G.note(M.who + ': ' + M.nm + '(0) = ' + fmt(z) + ', ' + M.nm + '(1) = ' + fmt(o));
          G.lock(true); G.after(V.say(i === 0 ? ['g11_zero_title', 'g11_one_sequel'] : i === 2 ? ['g11_zero_first', 'g11_one_dislike'] : []), function () { G.lock(false); i++; var n = $('#s2n'); if (n) n.textContent = String(i); if (i < LIST.length) show(); else done(); }); }
        else { wrong++; firstAll = false; G.firstTry(false); G.say(a !== z ? 'Zero goes in the slot: ' + M.nm + '(0) = ' + M.show(0) + '.' + (k === 'm' && a === 0 ? ' Zero times 4 is 0, but then the rule takes away 3.' : '') : 'One goes in the slot: ' + M.nm + '(1) = ' + M.show(1) + '.', 'bad'); }
      }
    }
    function done() { var clean = firstAll && G.levelMaxRung <= 1; G.P.s2 = (G.P.s2 && G.P.s2.clean) ? G.P.s2 : { clean: clean, wrong: wrong }; G.save();
      G.lock(true); G.after(V.say(['g11_marcus_sk', 'g11_duo_him', 'g11_marcus_avail', 'g11_duo_no']), function () { G.lock(false); finishLevel('S2', 'Every machine has an f(0) and an f(1). Zero always goes in first: the slot goes in order. For the Multiplex, m(0) = −3 and m(1) = 1.' + (clean ? ' You earned f of 0, f of 1.' : ''), []); }); }
    G.hintFn = function (r) {
      var k = LIST[i]; if (!k) return; var M = MACH[k];
      if (r === 1) { V.say('g11_priya_titles'); G.say('Hint: f(0) means put 0 in the slot. f(1) means put 1 in the slot.'); }
      else if (r === 2) G.say('Hint: ' + M.nm + '(0) = ' + M.show(0) + ' and ' + M.nm + '(1) = ' + M.show(1) + '.');
      else if (r === 3) G.say('Worked step: ' + work(k, 0) + '. ' + work(k, 1) + '.');
      else { var zi = $('#s2z'); if (zi) { zi.value = String(M.fn(0)); $('#s2o').value = String(M.fn(1)); $('#s2ck').click(); } }
    };
    talk(['g11_priya_titles'], function () { var z = $('#s2z'); if (z) z.focus(); }); show();
  }

  /* ================= S3: whose dot is it? (point back to sentence) ================= */
  function S3(G) {
    reset('hall', 'night'); ST.cast = { gus: { x: 70, f: 1, sc: 0.62 }, doug: { x: 140, f: 1, sc: 1.2 }, effie: { x: 210, sc: 1.6 } };
    ST.grid = { x: 300, y: 40, w: 400, h: 330, xr: [-4, 8], yr: [-4, 10], dots: [], ticks: true };
    var DOTS = [[2, 5, 'm'], [4, 9, 'h'], [-3, 9, 's'], [3, 7, 'f'], [7, 7, 'o'], [0, -3, 'm']], PICK = ['f', 'h', 'm', 's', 'o'];
    var i = 0, wrong = 0;
    G.setTask('Whose Dot Is It?', job('Gus found dots on the Grid. Which machine left each one?', '', ['Read the dot: (input, output).', 'Put the input into each rule card.', 'Tap the machine that gives that output.'], 'all 6 dots have a sentence (<b id="s3n">0</b> of 6).'));
    var body = el('div', { 'class': 'stack', style: 'gap:6px' }); G.work.appendChild(body);
    body.appendChild(el('div', { 'class': 'minitape' }, PICK.map(function (k) { var M = MACH[k]; return el('span', { 'class': 'tr', text: M.nm + '(x) = ' + M.rule + ' (' + M.who.replace('The ', '') + ')' }); })));
    var area = el('div', { 'class': 'stack', style: 'gap:6px' }); body.appendChild(area);
    function show() {
      var D = DOTS[i]; area.innerHTML = ''; G.say('');
      ST.grid.dots = ST.grid.dots.filter(function (d) { return d.done; }); ST.grid.dots.push({ x: D[0], y: D[1], t0: S.now(), col: '#FF8FD1', lab: '(' + fmt(D[0]) + ', ' + fmt(D[1]) + ')' });
      area.appendChild(el('p', { style: 'margin:0;font:600 22px var(--mono);color:var(--marquee)', text: 'Dot ' + (i + 1) + ' of 6: (' + fmt(D[0]) + ', ' + fmt(D[1]) + ')' }));
      area.appendChild(el('small', { 'class': 'muted', text: 'Input ' + fmt(D[0]) + ', output ' + fmt(D[1]) + '. Which rule turns ' + fmt(D[0]) + ' into ' + fmt(D[1]) + '?' }));
      var row = el('div', { 'class': 'row' }); area.appendChild(row); var fb = el('small', { 'class': 'muted' }); area.appendChild(fb);
      PICK.forEach(function (k) { row.appendChild(el('button', { type: 'button', 'class': 'btn small', 'data-k': k, text: MACH[k].nm + '  (' + MACH[k].who.replace('The ', '').replace('Squaring ', '').replace(' 4000', '') + ')', onclick: function (e) { pick(k, e.target, fb); } })); });
    }
    function pick(k, btn, fb) {
      if (busy()) return; var D = DOTS[i], M = MACH[k], y = M.fn(D[0]);
      if (k === D[2]) {
        G.firstTry(true); var s = sent(k, D[0]); fb.textContent = s + '. That\'s the sentence for this dot.'; fb.className = 'good'; ST.grid.dots[ST.grid.dots.length - 1].col = '#FFD23F'; ST.grid.dots[ST.grid.dots.length - 1].done = true; ST.grid.dots[ST.grid.dots.length - 1].lab = s;
        G.note('(' + fmt(D[0]) + ', ' + fmt(D[1]) + ') → ' + s, 'hl'); G.say('Yes: ' + work(k, D[0]) + '. The dot (' + fmt(D[0]) + ', ' + fmt(D[1]) + ') says ' + s + '.', 'good');
        G.lock(true); G.after(V.say(i === 0 ? ['g11_gus_backwards'] : i === 5 ? ['g11_effie_doug', 'g11_doug_coo'] : []), function () { G.lock(false); i++; var n = $('#s3n'); if (n) n.textContent = String(i); if (i < DOTS.length) show(); else done(); });
      } else { wrong++; G.firstTry(false); btn.disabled = true; fb.textContent = work(k, D[0]) + ', not ' + fmt(D[1]) + '. So not ' + M.nm + '.'; fb.className = 'bad'; }
    }
    function done() { var clean = wrong <= 1 && G.levelMaxRung <= 1; G.P.s3 = (G.P.s3 && G.P.s3.clean) ? G.P.s3 : { clean: clean, wrong: wrong }; G.save(); finishLevel('S3', 'Six dots, six sentences. A dot is a pair, and a pair is a sentence: (2, 5) is m(2) = 5. Wrong picks: ' + wrong + '.' + (clean ? ' You earned Dot Detective.' : ''), ['g11_effie_promise']); }
    G.hintFn = function (r) {
      var D = DOTS[i]; if (!D) return;
      if (r === 1) { V.say('g11_gus_backwards'); G.say('Hint: the dot (' + fmt(D[0]) + ', ' + fmt(D[1]) + ') means input ' + fmt(D[0]) + ', output ' + fmt(D[1]) + '. Put ' + fmt(D[0]) + ' into each rule.'); }
      else if (r === 2) G.say('Hint: ' + PICK.map(function (k) { return MACH[k].nm + '(' + fmt(D[0]) + ') = ' + fmt(MACH[k].fn(D[0])); }).join(',  ') + '. Which one is ' + fmt(D[1]) + '?');
      else if (r === 3) G.say('Worked step: ' + work(D[2], D[0]) + '. Tap ' + MACH[D[2]].nm + '.');
      else { var b = document.querySelector('#workBody [data-k="' + D[2] + '"]'); if (b) b.click(); }
    };
    talk(['g11_effie_doug', 'g11_doug_coo']); show();
  }

  Gm.boot('Press <strong>Start naming</strong>. The Eraser is rubbing out the names of Sandy Flats\' machines, and a machine with no name forgets its rule. Say each name back: sentence, pair, point.');
  window.__gm = function () { return Gm; }; window.__g11 = { G: Gm, ST: ST, MACH: MACH };
})();
