<script>/* O1 "Across Three, Up One" (outtake, rewards Scorch Marks). Priya flubs her line and flips the slope.
   Easter egg: the triangle on the board is labelled across 3, up 1, the reciprocal of the real slope 3 (up 3, across 1). */
window.REEL = {
  title: 'Across Three, Up One',
  beats: [
    { bg: 'class', cast: { priya: { x: 330, f: 1 }, marcus: { x: 720, f: -1 } }, clap: 'TAKE 14', dur: 1.3 },
    { line: 'o1_1', hold: 0.5, flipped: true },
    { line: 'o1_2', hold: 0.4, flipped: true },
    { line: 'o1_3', hold: 0.1 },
    { line: 'o1_4', hold: 0.6 },
    { clap: 'TAKE 15', dur: 1.2, fixed: true },
    { line: 'o1_5', hold: 1.4, fixed: true }
  ],
  draw: function (A, t, T, b) {
    var E = A.E, c = A.c, x0 = 230, y0 = 200;
    c.save(); c.strokeStyle = '#F4F4EC'; c.lineWidth = 4;
    if (b.fixed) { c.beginPath(); c.moveTo(x0, y0); c.lineTo(x0 + 50, y0); c.lineTo(x0 + 50, y0 - 120); c.closePath(); c.stroke(); E.txt('across 1', x0 + 25, y0 + 18, '22px "Patrick Hand",cursive', '#F4F4EC'); E.txt('up 3', x0 + 90, y0 - 60, '22px "Patrick Hand",cursive', '#FFE27A'); E.txt('slope = 3 ✓', 400, 120, '30px "Patrick Hand",cursive', '#9BE89B'); }
    else { c.beginPath(); c.moveTo(x0, y0); c.lineTo(x0 + 150, y0); c.lineTo(x0 + 150, y0 - 50); c.closePath(); c.stroke(); E.txt('across 3', x0 + 75, y0 + 18, '22px "Patrick Hand",cursive', '#F4F4EC'); E.txt('up 1', x0 + 190, y0 - 25, '22px "Patrick Hand",cursive', '#FFE27A'); if (b.flipped) E.txt('slope = 1/3 ?', 420, 110, '30px "Patrick Hand",cursive', '#FF9A8A'); }
    c.restore();
  }
};
</script>
