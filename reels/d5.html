<script>/* D5 "Sam Meets Linesy" (deleted scene, GOLD reel for Friend of Sam). Easter egg: Linesy sweeps Sam's U (y = x²) and the
   counter never goes past 1, while the sulking Loop in the corner shows a 2. */
(function () {
  var gx = function (x) { return 480 + x * 70; }, gy = function (y) { return 440 - y * 38; };
  window.REEL = {
    title: 'Sam Meets Linesy',
    beats: [
      { bg: 'dark', cast: { sam: { x: 170, f: 1, sc: 0.75 }, loop: { x: 880, sc: 0.8 } }, line: 'd5_1', hold: 0.6 },
      { line: 'd5_2', hold: 0.5, sweep: [-3.2, -2.4] },
      { line: 'd5_3', hold: 0.8, sweep: [-2.4, -0.6] },
      { line: 'd5_4', hold: 0.5, sweep: [-0.6, 0.8] },
      { line: 'd5_5', hold: 0.8, sweep: [0.8, 2.8] },
      { line: 'd5_6', hold: 0.6, sweep: [2.8, 2.8], loopTwo: true },
      { line: 'd5_7', hold: 1.8, sweep: [2.8, 2.8], tears: true }
    ],
    under: function (A, t, T, b, p) {
      var E = A.E, c = A.c;
      c.save(); c.strokeStyle = 'rgba(255,210,63,.14)'; c.lineWidth = 1; for (var x = -4; x <= 4; x++) { c.beginPath(); c.moveTo(gx(x), gy(-0.5)); c.lineTo(gx(x), gy(10)); c.stroke(); } for (var y = 0; y <= 10; y++) { c.beginPath(); c.moveTo(gx(-4), gy(y)); c.lineTo(gx(4), gy(y)); c.stroke(); }
      c.strokeStyle = 'rgba(255,210,63,.7)'; c.lineWidth = 2; c.beginPath(); c.moveTo(gx(0), gy(-0.5)); c.lineTo(gx(0), gy(10)); c.moveTo(gx(-4), gy(0)); c.lineTo(gx(4), gy(0)); c.stroke();
      c.strokeStyle = '#B9A8FF'; c.lineWidth = 6; c.shadowColor = '#B9A8FF'; c.shadowBlur = 16; c.beginPath(); for (var k = -3.2; k <= 3.21; k += 0.05) { var px = gx(k), py = gy(k * k); if (k === -3.2) c.moveTo(px, py); else c.lineTo(px, py); } c.stroke(); c.restore();
      E.txt('y = x²', gx(2.6), gy(9.4), '600 20px "IBM Plex Mono",monospace', '#B9A8FF');
    },
    draw: function (A, t, T, b, p) {
      var E = A.E, c = A.c;
      if (b.sweep) {
        var u = Math.min(1, p / Math.max(0.5, b.d - 0.3)), x = b.sweep[0] + (b.sweep[1] - b.sweep[0]) * u, lx = gx(x);
