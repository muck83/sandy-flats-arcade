<script>/* D1 "The Multiplex 5000" (deleted scene, rewards Crack the Fair). Marcus builds a machine from a bin. Zero cracks it in one input.

  title: 'The Multiplex 5000',

    { bg: 'class', cast: { marcus: { x: 300, f: 1 }, fair: { x: 640, label: 'MULTIPLEX 5000', col: '#3E8E5A' }, zero: { x: 140 } }, line: 'd1_1', hold: 0.5 },

  }
};
