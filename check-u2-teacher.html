<style>
/* Unit 2 Check dashboard: the open/closed switch with its settings, class table by criterion and skill, flags, worked-out questions, regrouping. */
.dash{max-width:1380px}
.l0{--lc:#2E2A3D;--lt:#ABA5BC}.l1{--lc:#E8584C;--lt:#2A0703}.l2{--lc:#FF9F45;--lt:#2A1400}.l3{--lc:#FFC94A;--lt:#2A1E00}.l4{--lc:#3BFF8A;--lt:#00260F}
.muted{color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-top:12px}
.bar .grow{flex:1 1 auto}
.bar input[type=search]{font:600 15px var(--ui);padding:8px 12px;border-radius:999px;border:2px solid var(--line);background:#0E0C14;color:var(--ink);min-width:180px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{all:unset;cursor:pointer;font:600 13px var(--ui);padding:6px 12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--marquee);color:#231800}
.seg button:focus-visible{outline:3px solid var(--marquee);outline-offset:-3px}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0;margin-top:14px}
.panel h2{font-family:var(--display);font-weight:400;letter-spacing:.03em;color:var(--marquee);font-size:20px;margin:0 0 4px}
.panel .sub{font-size:13px;color:var(--muted);margin:0 0 10px;max-width:95ch}
.codebox{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center}
.bigcode{font:600 clamp(40px,7vw,72px)/1 var(--mono);letter-spacing:.18em;color:var(--marquee);background:#0E0C14;border:2px solid var(--line);border-radius:14px;padding:12px 10px 12px 22px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:14px}
.kpi{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi .k{font:600 12px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--display);font-size:32px;line-height:1.1;color:var(--marquee)}
.kpi .s{font-size:13px;color:var(--muted)}
.kpi.warn .v{color:#FF8E84}
.heat{overflow-x:auto;margin-top:6px}
table.hm{border-collapse:separate;border-spacing:3px;min-width:100%}
.hm th{font:600 11px var(--ui);color:var(--muted);text-align:center;vertical-align:bottom;padding:4px 2px;white-space:nowrap}
.hm th.sk{height:150px}
.hm th.sk span{display:inline-block;writing-mode:vertical-rl;transform:rotate(180deg);max-height:146px;overflow:hidden;text-overflow:ellipsis}
.hm th.cg{font-size:10px;letter-spacing:.08em;text-transform:uppercase;border-bottom:2px solid var(--line);padding-bottom:3px}
.hm th.sortable{cursor:pointer}
.hm th.sortable:hover{color:var(--marquee)}
.hm td{padding:0}
.hm td.who{padding:4px 10px 4px 2px;white-space:nowrap;font-size:14px;font-weight:600}
.hm td.who button{all:unset;cursor:pointer}
.hm td.who button:hover,.hm td.who button:focus-visible{color:var(--marquee);text-decoration:underline}
.hm td.who small{color:var(--muted);font-weight:400;margin-left:6px;font-size:11px}
.hm td.c{width:32px;min-width:28px;height:30px;border-radius:7px;background:var(--lc);text-align:center;font:700 11px var(--mono);color:var(--lt)}
.hm td.c.cr{width:40px;min-width:36px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.hm td.meta{padding:0 8px;font:500 12px var(--mono);color:var(--muted);white-space:nowrap;text-align:right}
.hm td.sc{font:600 13px var(--mono);padding:0 8px;white-space:nowrap;text-align:right}
.hm td.fl{padding:0 6px;font-size:12px;white-space:nowrap;text-align:left}
.tag{display:inline-block;font:700 10px var(--ui);letter-spacing:.04em;text-transform:uppercase;background:#4A1D1A;color:#FF8E84;border-radius:999px;padding:2px 7px;margin:1px 3px 1px 0}
.tag.soft{background:#3A3550;color:#D9D3EA}
.badge{flex:none;display:inline-block;font:700 11px var(--ui);padding:3px 9px;border-radius:999px;background:var(--lc);color:var(--lt);white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;background:var(--lc);display:inline-block}
.rgroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px}
.rgrp{background:var(--panel2);border-radius:12px;padding:10px 12px;border-top:5px solid var(--lc,#3A3550)}
.rgrp .gh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.rgrp .names{font-size:14px;margin-top:4px;line-height:1.6}
.rgrp small{color:var(--muted)}
.pp{display:grid;gap:8px}
.pp details{background:var(--panel2);border-radius:12px;padding:8px 12px}
.pp summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.pp summary b{min-width:11em}
.pp .code{font:600 14px var(--mono);background:#0E0C14;border-radius:6px;padding:2px 8px}
.ppq{background:var(--paper);color:var(--paperink);border-radius:12px;padding:12px 14px;margin-top:8px}
.ppq .gr{max-width:260px}
.ppq ol.steps{margin:8px 0 0;padding-left:20px}
.ppq ol.steps li{margin:6px 0}
.ppq .ans{margin-top:8px;font-weight:700;border-top:2px dashed #CFC7AC;padding-top:8px}
.drawer{position:fixed;inset:0 0 0 auto;width:min(520px,100vw);background:var(--panel);border-left:2px solid var(--line);box-shadow:-20px 0 50px rgba(0,0,0,.5);z-index:60;overflow-y:auto;padding:18px;transform:translateX(105%);transition:transform .25s ease;visibility:hidden}
.drawer.open{transform:none;visibility:visible}
.drawer h2{font-family:var(--display);font-weight:400;color:var(--marquee);margin:0;font-size:24px}
.drawer h3{margin:16px 0 4px;font-size:15px}
.drawer .x{float:right}
.dsk{display:grid;grid-template-columns:1fr auto auto;gap:6px 10px;align-items:center;margin-top:6px;font-size:14px}
.dsk small{color:var(--muted);font:500 12px var(--mono)}
table.log{border-collapse:collapse;width:100%;font-size:13px;margin-top:6px}
.log th,.log td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.log td.ok{color:var(--green)}.log td.no{color:#FF8E84}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.how{margin-top:14px;color:var(--muted)}
.how summary{cursor:pointer;color:var(--ink);font-weight:700}
.how li{margin:5px 0;max-width:100ch}
body.hide .nmv{filter:blur(6px)}
@media print{body{background:#fff;color:#000}.bar,.kpis,.drawer,.how,.noprint,.sfanav,.topbar{display:none!important}.panel{border:1px solid #999;background:#fff;color:#000}.pp details{background:#fff;border:1px solid #bbb}.muted,.panel .sub{color:#333}}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
/* completed formative task sheets (printed from the dashboard): one page per student */
#sheets{display:none}
@media print{
  body.sheets .wrap,body.sheets .drawer{display:none!important}
  body.sheets #sheets{display:block}
  @page{size:letter portrait;margin:.4in}
  .ts{page-break-after:always;font:9.5pt/1.25 Arial,Helvetica,sans-serif;color:#000;background:#fff}
  .ts:last-child{page-break-after:auto}
  .ts h1{font:700 16pt Arial,sans-serif;margin:0}
  .ts .hd{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:6px}
  .ts .meta{font-size:9.5pt;color:#333}
  .ts .who{text-align:right;font-size:11pt}
  .ts .who b{font-size:13pt}
  .ts table{width:100%;border-collapse:collapse;margin-top:6px}
  .ts th,.ts td{border:1px solid #777;padding:2px 4px;vertical-align:top;font-size:7.6pt;line-height:1.2}
  .ts th{background:#eee;font-size:7.8pt}
  .ts col.c1{width:28%}.ts col.c2{width:9%}
  .ts td.cn{font-weight:700;background:#f6f6f6}
  .ts td.sk{padding-left:12px}
  .ts td.hit{background:#d9d9d9;outline:2.5px solid #000;outline-offset:-3px;font-weight:700}
  .ts td.hit:before{content:'✔ '}
  .ts td.lv{text-align:center;white-space:nowrap;font-weight:700}
  .ts td.ne{color:#555;font-style:italic;text-align:center}
  .ts .tsov{display:flex;gap:16px;align-items:baseline;margin-top:8px;font-size:11pt}
  .ts .box{border:1px solid #777;padding:3px 7px;margin-top:5px}
  .ts .two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .ts .box h3{margin:0 0 2px;font:700 10pt Arial,sans-serif}
  .ts .box ul,.ts .box ol{margin:1px 0 0;padding-left:1.4em;font-size:8.6pt}
  .ts .box li{margin:1px 0}
  .ts .how2{font-size:8pt;color:#333;margin-top:2px}
  .ts .lines{border-bottom:1px solid #999;height:.22in}
  .ts .fine{font-size:8pt;color:#444;margin-top:5px}
}
</style>

<script>
(function () {
  'use strict';
  var SFA = window.SFA, el = SFA.el, CU = window.CU2, CFG = window.SFA_CONFIG || {}, body = document.getElementById('body'), drawer = document.getElementById('drawer');
  var DEMO = /[?&]demo/.test(location.search), TRY = !!window.CU2_TRY, CO = /[?&]co\b/.test(location.search);   // ?co: the co-teacher's view (her key, her classes)
  var CRIT = CU.CRIT, SK = CU.SK, LV = CU.LV, ABBR = ['?', 'L', 'E', 'D', 'D+'], FL = CU.FLAG;
  var SKN = {}; SK.forEach(function (k) { SKN[k.id] = k; });

  /* ---------- teacher key (shared with Class Results) ---------- */
  var KEY = CO ? 'sfa.cokey' : 'sfa.classkey';
  var Key = {
    get: function () { if (TRY) return CO ? 'co' : 'test'; try { var s = sessionStorage.getItem(KEY); if (s) return s; var r = JSON.parse(localStorage.getItem(KEY) || 'null'); if (r && r.until > Date.now()) return r.k; } catch (e) { } return ''; },
    set: function (k, remember) { try { sessionStorage.setItem(KEY, k); if (remember) { var d = new Date(); d.setHours(23, 59, 59, 0); localStorage.setItem(KEY, JSON.stringify({ k: k, until: d.getTime() })); } } catch (e) { } },
    del: function () { try { sessionStorage.removeItem(KEY); localStorage.removeItem(KEY); } catch (e) { } }
  };
  function api(op, extra) {
    if (CO && op === 'class') op = 'coClass';

    return fetch(CFG.endpoint, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(b) })
      .then(function (r) { return r.text(); })
      .then(function (t) { try { return JSON.parse(t); } catch (e) { throw new Error('The results script didn\'t answer properly.'); } })
      .then(function (j) { if (!j.ok) throw new Error(j.error); return j; });
  }
  function pref(k, d) { try { var v = localStorage.getItem('sfa.ckdash.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  function setPref(k, v) { try { localStorage.setItem('sfa.ckdash.' + k, JSON.stringify(v)); } catch (e) { } }

  var S = { rows: [], cls: pref('cls', ''), q: '', sort: pref('sort', 'name'), auto: pref('auto', true), at: null, code: null, len: [4, 0, 1].indexOf(pref('len', 0)) >= 0 ? pref('len', 0) : 0, top: pref('top', 0), chk: pref('chk', 0), names: pref('names', {}), merge: pref('merge', {}), raw: null, day: pref('day', 'all') };
  var timer = null;
  function nice(n) { n = String(n || ''); if (n.indexOf(',') < 0) return n; var p = n.split(','); return (p[1].trim().split(' ')[0] + ' ' + p[0].trim()).trim(); }
  function hhmm(t) { return new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
  function nm(r) { return el('span', { 'class': 'nmv', text: nice(r.name) }); }
  // Check 1 to 4: each keeps its own results; the teacher can name them (kept in this browser)
  var STU = location.href.replace(/[^/]*$/, '') + 'check-u2.html' + (TRY ? '?try' : '');   // the link students open
  var PRAC = STU + (TRY ? '&' : '?') + 'practice';   // straight to a practice check (10, 20 or 30 minutes)
  function copyTxt(t, what) { try { navigator.clipboard.writeText(t).then(function () { SFA.toast(what + ' copied'); }, function () { SFA.toast(t, 6000); }); } catch (e) { SFA.toast(t, 6000); } }
  // L, E, D, D+, or a range like L–E when the ± crosses a cut score
  function spanAbbr(o) { var s = CU.span(o); return !s ? ABBR[0] : s.lo === s.hi ? ABBR[s.lo] : ABBR[s.lo] + '–' + ABBR[s.hi]; }
  function label(n) { return n === CU.PRACTICE ? 'Practice' : (S.names && S.names[n]) || 'Check ' + (n + 1); }

  /* ---------- one row per student, rebuilt from the saved summary by the same engine the student page used ---------- */
  function build(j) {
    S.raw = j; S.count = CU.KEYS.map(function () { return 0; }); S.countP = 0;
    S.sessCount = {};
    (j.progress || []).forEach(function (p) { var mc = String(p.levels || '').match(/(?:^| )A[0-9a-z]{7}\.([a-z]{5})/); if (mc) S.sessCount[mc[1].toUpperCase()] = (S.sessCount[mc[1].toUpperCase()] || 0) + 1; });
    // the Checks shown here: the chosen one, plus any combined into it (S.merge: {from: into}, kept in this browser).
    // A student with an attempt in more than one: the attempt with the most answers (then the latest) counts.
    var keys = {}; keys[CU.keyFor(S.chk)] = 1;
    if (S.chk !== CU.PRACTICE) Object.keys(S.merge || {}).forEach(function (f) { if (S.merge[f] === S.chk) keys[CU.keyFor(+f)] = 1; });
    var by = {}, on = {}; (j.roster || []).forEach(function (s) { on[s.sid] = 1; });
    var weight = function (p) { var a = CU.decode(p.levels); return a.ok ? a.log.length * 1e13 + (a.t0 || 0) : -1; };
    (j.progress || []).forEach(function (p) {
      if (!on[p.sid]) return; var n = CU.KEYS.indexOf(p.game); if (n >= 0) S.count[n]++; if (p.game === CU.PRACTICE_KEY) S.countP++;
      if (keys[p.game] && (!by[p.sid] || weight(p) > weight(by[p.sid]))) by[p.sid] = p;
    });
    S.shownN = Object.keys(by).length;
    return (j.roster || []).map(function (s) {
      var p = by[s.sid], att = p ? CU.decode(p.levels) : null, r = { sid: s.sid, name: s.name, cls: s.cls || '', extra: s.extra || 0, p: p, att: att && att.ok ? att : null, updated: p ? p.updated : '' };
      if (!r.att) return r;
      var log = r.att.log, sc = r.sc = CU.score(log);
      var f = r.flags = { away: 0, awaySecs: 0, paste: 0, copy: 0, quick: 0, guess: 0, slow: 0, idk: 0, reloads: r.att.reloads || 0, ext: r.att.ext || 0 };
      log.forEach(function (e) {
        if (e.f & FL.away) { f.away++; f.awaySecs += e.a || 0; } if (e.f & FL.paste) f.paste++; if (e.f & FL.copy) f.copy++; if (e.f & FL.slow) f.slow++; if (e.idk) f.idk++;
        if (e.f & FL.fast) { if (e.ok && e.d >= 3) f.quick++; else if (!e.ok && !e.idk) f.guess++; }
      });
      var tags = [];
      if (f.away) tags.push(['Left tab ×' + f.away + (f.awaySecs ? ' (' + f.awaySecs + ' s)' : ''), f.away >= 2 || f.awaySecs >= 30]);
      if (f.paste) tags.push(['Paste ×' + f.paste, true]); if (f.copy) tags.push(['Copied question ×' + f.copy, true]);
      if (f.quick) tags.push(['Very fast and right ×' + f.quick, f.quick >= 2]); if (f.guess >= 3) tags.push(['Rapid guesses ×' + f.guess, false]);
      if (f.slow) tags.push(['Very slow ×' + f.slow, false]); if (f.reloads > 1) tags.push(['Reloads ×' + f.reloads, false]); if (f.ext) tags.push(['Extra time ×' + f.ext, false]);
      // right answers while away from the tab, on Developed-level or harder questions: the pattern most worth a conversation
      var awayRight = log.filter(function (e) { return (e.f & FL.away) && e.ok && e.d >= 3; }).length; if (awayRight) tags.push(['Right after leaving ×' + awayRight, true]);
      r.tags = tags; r.hot = tags.some(function (t) { return t[1]; });
      r.state = r.att.state === 'r' ? (Date.now() - Date.parse(r.updated) < 4 * 60000 ? 'Working' : 'Stopped mid-test') : ({ t: 'Finished (time)', s: 'Finished (steady)', m: 'Finished (all questions)', x: 'Ended' })[r.att.state] || 'Finished';
      r.mins = Math.round((r.att.elapsed || 0) / 60);
      var cs = CRIT.filter(function (c) { return sc.crit[c.id].level; }).sort(function (a, b) { return sc.crit[a.id].th - sc.crit[b.id].th; });
      r.weak = cs.length ? cs[0] : null;
      return r;
    });
  }
  function dayOf(r) { return r.att ? new Date(r.att.t0).toDateString() : ''; }
  function inScope(r) { return (!S.cls || r.cls === S.cls); }
  function shown() {
    var q = S.q.toLowerCase(), r = S.rows.filter(function (x) { return inScope(x) && (!q || nice(x.name).toLowerCase().indexOf(q) >= 0); });
    var th = function (x) { return x.att ? x.sc.th : -99; };
    var cmp = { name: function (a, b) { return a.name.localeCompare(b.name); }, low: function (a, b) { return th(a) - th(b) || a.name.localeCompare(b.name); }, high: function (a, b) { return th(b) - th(a) || a.name.localeCompare(b.name); }, flags: function (a, b) { return ((b.tags || []).length + (b.hot ? 10 : 0)) - ((a.tags || []).length + (a.hot ? 10 : 0)) || a.name.localeCompare(b.name); } }[S.sort];

  }

  /* ---------- render ---------- */
  function render() {
    var all = S.rows.filter(inScope), rows = shown(), done = all.filter(function (r) { return r.att; });
    body.innerHTML = '';
    body.appendChild(toolbar());
    body.appendChild(checkPicker());
    body.appendChild(codePanel());
    if (!all.length) { body.appendChild(el('p', { 'class': 'muted', text: 'No students on the roster for this class.' })); return; }

    var fin = done.filter(function (r) { return r.att.state !== 'r'; }), lev = done.filter(function (r) { return r.sc.level; });
    var med = lev.map(function (r) { return r.sc.scale; }).sort(function (a, b) { return a - b; }), mid = med.length ? med[Math.floor((med.length - 1) / 2)] : 0;
    var devp = lev.filter(function (r) { return r.sc.level >= 3; }).length, hot = done.filter(function (r) { return r.hot; }).length;
    var cw = CRIT.map(function (c) { var l = done.filter(function (r) { return r.sc.crit[c.id].level; }); return { c: c, n: l.filter(function (r) { return r.sc.crit[c.id].level >= 3; }).length, of: l.length }; }).filter(function (x) { return x.of; }).sort(function (a, b) { return a.n / a.of - b.n / b.of; })[0];
    body.appendChild(el('div', { 'class': 'kpis' }, [
      kpi('Started', done.length + '/' + all.length, fin.length + ' finished', false),
      kpi('Median scale score', mid ? String(mid) : '·', 'cut scores 450 · 550 · 650', false),
      kpi('At Developed or Deep', lev.length ? devp + '/' + lev.length : '·', 'overall, of those with enough answers', false),
      kpi('Reteach first', cw ? cw.c.short : '·', cw ? cw.n + ' of ' + cw.of + ' at Developed+' : 'no results yet', !!cw && cw.n < cw.of / 2),
      kpi('Worth a conversation', String(hot), 'students with strong flags', hot > 0)
    ]));

    // class table

  /* ---------- loading ---------- */
  function schedule() { clearInterval(timer); if (S.auto && !DEMO) timer = setInterval(function () { if (document.visibilityState === 'visible' && !drawer.classList.contains('open') && !body.querySelector('details[open]') && document.activeElement.tagName !== 'INPUT') load(false); }, 30000); }
  function askKey(msg) {
    var inp = el('input', { type: 'password', style: 'font:600 15px var(--mono);padding:9px 12px;border-radius:10px;border:2px solid var(--line);background:#0E0C14;color:var(--ink);width:22em;max-width:100%', autocomplete: 'off', 'aria-label': 'Teacher key' });
    var rem = el('input', { type: 'checkbox', id: 'remKey' });
    var go = el('button', { type: 'button', 'class': 'btn primary', text: 'Open the dashboard', onclick: function () { Key.set(inp.value.trim(), rem.checked); load(true); } });
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') go.click(); });
    body.innerHTML = '';
    body.appendChild(el('div', { 'class': 'panel', style: 'max-width:640px' }, [
      el('h2', { text: 'Teacher key' }), el('p', { 'class': 'muted', text: msg || (CO ? 'Your co-teacher key (the one on your Students page). It is forgotten when you close this tab, unless you tick the box.' : 'The same key as Class Results. It is forgotten when you close this tab, unless you tick the box.') }),
      el('div', { 'class': 'bar' }, [inp, go]),
      el('label', { 'for': 'remKey', style: 'display:flex;gap:8px;align-items:center;margin-top:10px' }, [rem, 'Remember on this computer until the end of today']),
      el('p', { 'class': 'muted', style: 'font-size:13px' }, ['Just looking? ', el('a', { href: '?demo', text: 'Open it with a sample class' }), ', or ', el('a', { href: '?try', text: 'use the practice class' }), ' (students try it at check-u2.html?try with codes AAAAAA, BBBBBB, CCCCCC).'])
    ]));
    inp.focus();
  }
  function load(loud) {
    if (DEMO) { if (!S.rows.length) S.rows = build(demo()); S.at = new Date(); render(); return; }
    if (!CFG.endpoint) { body.textContent = 'Results saving isn\'t switched on for this copy of the arcade.'; return; }
    if (!Key.get()) return askKey();
    if (loud && !S.rows.length) body.innerHTML = '<p class="muted">Loading the class…</p>';
    api('checkState').then(function (g) { S.gate = g; }, function (e) { S.gate = { err: e.message }; }).then(function () { return api('class'); }).then(function (j) { S.rows = build(j); S.at = new Date(); render(); schedule(); }, function (e) {
      if (/teacher key/.test(e.message)) { Key.del(); askKey('That key didn\'t work. Check it and try again.'); }
      else if (loud || !S.rows.length) body.innerHTML = '<p style="color:#FF8E84">Couldn\'t reach the results sheet. ' + SFA.esc(e.message) + '</p>';
    });
  }

  // a made-up class for ?demo: every student is a real run of the adaptive engine with a pretend ability
  function demo() {
    var first = ['Ava', 'Ben', 'Chloe', 'Dev', 'Eli', 'Farah', 'Gus', 'Hana', 'Ivan', 'Jun', 'Kira', 'Leo', 'Maya', 'Noor', 'Omar', 'Pia', 'Quinn', 'Rosa', 'Sami', 'Tara', 'Umar', 'Vera', 'Wes', 'Yara'];
    var last = ['Khan', 'Lopez', 'Smith', 'Okafor', 'Haddad', 'Nguyen', 'Silva', 'Ito', 'Petrov', 'Mensah', 'Rossi', 'Novak'];
    var hard = { compute: -.3, convert: .6, represent: .2, explain: 0 }, R = CU.rng(11), roster = [], progress = [], t0 = Date.now() - 50 * 60000;
    first.forEach(function (f, i) {
      var sid = 'd' + i; roster.push({ sid: sid, name: last[i % last.length] + ', ' + f, cls: i % 2 ? 'B' : 'A' });
      if (i % 11 === 7) return;
      var base = -1.6 + R.f() * 3.6, off = {}; CU.IDS.forEach(function (id) { off[id] = (R.f() - .5) * 1.0; });
      var att = CU.simulate(1000 + i * 7919, function (sk) { return base - hard[SKN[sk].crit] + off[sk]; }, { t0: t0 + i * 20000, pace: .6 + R.f() * .6, flag: i % 6 === 2 ? .2 : .006, cheat: i === 8 ? .8 : 0, code: 'DEMOX'.replace(/[AEIOU]/g, 'K') });
      if (i % 9 === 5) { att.end = null; att.log = att.log.slice(0, 9); }
      var m = CU.summary(att, att.end ? att.end.at : t0 + 12 * 60000);
      progress.push({ sid: sid, game: CU.KEY, updated: new Date(att.end ? att.end.at : Date.now() - 20000).toISOString(), levelsDone: 0, levelsTotal: 13, coreDone: m.coreDone, coreTotal: m.coreTotal, assisted: m.assisted, tickets: m.tickets, levels: CU.levelsText(m), specials: [] });
    });
    return { roster: roster, progress: progress };
  }

  load(true);
  window.CU2_DASH = { rows: function () { return S.rows; }, csv: csv };
})();
</script>
